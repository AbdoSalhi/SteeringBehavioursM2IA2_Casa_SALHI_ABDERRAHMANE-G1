<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seek — population de véhicules</title>
    <link rel="stylesheet" href="style.css">
    <script src="libraries/p5.min.js"></script>
    <script src="vehicle.js"></script>
    <script src="population.js"></script>
    <script src="obstacle.js"></script>
    <script src="target.js"></script>
    <script src="targetFuyante.js"></script>
    <script src="mouseTarget.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <header id="controls">
      <div class="control scenario-picker">
        <label for="scenario">Scénario</label>
        <select id="scenario">
          <option value="factuel">Scénario 1 – Factuel</option>
          <option value="fuyante">Scénario 2 – Cible fuyante</option>
        </select>
      </div>
      <div class="control">
        <label for="vehicle-count">Véhicules</label>
        <input id="vehicle-count" type="range" min="1" max="200" step="1" value="20">
        <output id="vehicle-count-value" for="vehicle-count">20 / 200</output>
      </div>
      <div class="control">
        <label for="obstacle-count">Obstacles</label>
        <input id="obstacle-count" type="range" min="0" max="30" step="1" value="12">
        <output id="obstacle-count-value" for="obstacle-count">12</output>
      </div>
      <div class="control">
        <label for="vehicle-size">Taille véhicule</label>
        <input id="vehicle-size" type="range" min="8" max="50" step="1" value="50">
        <output id="vehicle-size-value" for="vehicle-size">50</output>
      </div>
      <div class="control">
        <label for="vehicle-speed">Vitesse max.</label>
        <input id="vehicle-speed" type="range" min="1" max="20" step="0.5" value="4">
        <output id="vehicle-speed-value" for="vehicle-speed">4</output>
      </div>
      <div class="control">
        <label for="vehicle-force">Maniabilité</label>
        <input id="vehicle-force" type="range" min="0.01" max="1" step="0.01" value="0.1">
        <output id="vehicle-force-value" for="vehicle-force">0.10</output>
      </div>
      <div class="control">
        <label for="target-size">Rayon cible</label>
        <input id="target-size" type="range" min="6" max="40" step="1" value="16">
        <output id="target-size-value" for="target-size">16</output>
      </div>
      <div class="control scenario-escape-only" hidden>
        <label for="detection-radius">Détection</label>
        <input id="detection-radius" type="range" min="50" max="500" step="10" value="200">
        <output id="detection-radius-value" for="detection-radius">200 px</output>
      </div>
      <div class="control scenario-escape-only" hidden>
        <label for="endurance-duration">Endurance</label>
        <input id="endurance-duration" type="range" min="500" max="5000" step="100" value="2500">
        <output id="endurance-duration-value" for="endurance-duration">2.5 s</output>
      </div>
      <span class="hint">Choisissez un scénario. Touche D pour afficher/masquer le debug.</span>
    </header>
    <main id="scene" aria-label="Simulation de véhicules poursuivant ou faisant fuir une cible"></main>
  </body>
</html>
